<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Stars Market</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0c10;--card:#0e1420;--cyan:#00f2ff;--green:#00ffa3;
  --purple:#a855f7;--pink:#ec4899;--text:#cde8f0;--muted:rgba(205,232,240,.45);
  --border:rgba(0,242,255,.15);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;overflow-x:hidden}
body{
  background:
    radial-gradient(ellipse 100% 40% at 50% -5%,rgba(0,242,255,.08) 0%,transparent 60%),
    radial-gradient(ellipse 60% 30% at 95% 95%,rgba(168,85,247,.06) 0%,transparent 55%),
    var(--bg);
  padding-bottom:70px;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(0,242,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,242,255,.02) 1px,transparent 1px);
  background-size:36px 36px;
}
.nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(10,12,16,.97);border-top:1px solid rgba(0,242,255,.12);
  display:flex;z-index:100;backdrop-filter:blur(12px);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:10px 4px 8px;cursor:pointer;
  transition:color .2s;color:var(--muted);border:none;background:none;
  font-family:'Exo 2',sans-serif;
}
.nav-btn.active{color:var(--cyan)}
.nav-btn svg{width:22px;height:22px;margin-bottom:3px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-btn span{font-size:10px;font-weight:600;letter-spacing:.5px}
.page{display:none;position:relative;z-index:1;max-width:480px;margin:0 auto;padding:16px 14px}
.page.active{display:block}
.card{
  background:linear-gradient(135deg,rgba(0,242,255,.06),rgba(168,85,247,.04));
  border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.3);animation:fadeUp .4s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-top:4px}
.page-title{font-family:'Share Tech Mono',monospace;font-size:15px;color:var(--cyan);letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 12px rgba(0,242,255,.4)}
.lang-toggle{font-size:11px;color:var(--muted);cursor:pointer;background:rgba(0,242,255,.07);border:1px solid var(--border);border-radius:20px;padding:4px 10px}
.tabs{display:flex;background:rgba(0,242,255,.05);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px}
.tab{flex:1;text-align:center;padding:8px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);transition:all .2s}
.tab.active{background:linear-gradient(135deg,rgba(0,242,255,.18),rgba(0,255,163,.12));color:var(--cyan);box-shadow:0 0 12px rgba(0,242,255,.15)}
.product-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;background:rgba(0,242,255,.03);
  border:1px solid rgba(0,242,255,.07);border-radius:12px;
  margin-bottom:8px;cursor:pointer;transition:all .2s;
}
.product-item:active{background:rgba(0,242,255,.08);border-color:rgba(0,242,255,.2);transform:translateX(2px)}
.product-left{display:flex;align-items:center;gap:10px}
.product-ico{font-size:22px;filter:drop-shadow(0 0 6px rgba(0,242,255,.4))}
.product-name{font-size:14px;font-weight:700;color:var(--text)}
.product-sub{font-size:11px;color:var(--muted);margin-top:1px}
.product-price{font-family:'Share Tech Mono',monospace;font-size:13px;font-weight:700;color:var(--cyan);text-shadow:0 0 8px rgba(0,242,255,.3);white-space:nowrap}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;backdrop-filter:blur(6px);align-items:flex-end}
.modal-overlay.open{display:flex}
.modal{
  background:linear-gradient(180deg,#0e1420 0%,#0a0c10 100%);
  border:1px solid var(--border);border-radius:20px 20px 0 0;
  padding:24px 18px 36px;width:100%;
  animation:slideUp .3s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:rgba(0,242,255,.2);border-radius:2px;margin:0 auto 20px}
.modal-title{font-family:'Share Tech Mono',monospace;font-size:16px;color:var(--cyan);margin-bottom:6px;text-align:center}
.modal-price{font-size:28px;font-weight:800;text-align:center;margin-bottom:16px;background:linear-gradient(90deg,var(--cyan),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.modal-balance{text-align:center;font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-family:'Exo 2',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;margin-bottom:10px}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--green));color:#0a0c10;box-shadow:0 0 20px rgba(0,242,255,.35)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:rgba(0,242,255,.08);color:var(--cyan);border:1px solid var(--border)}
.profile-hero{background:linear-gradient(135deg,rgba(0,242,255,.1),rgba(168,85,247,.08));border:1px solid var(--border);border-radius:20px;padding:24px 20px;margin-bottom:14px;text-align:center}
.profile-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--purple));display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px;box-shadow:0 0 20px rgba(0,242,255,.3)}
.profile-name{font-size:18px;font-weight:800;color:var(--text);margin-bottom:2px}
.profile-id{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted)}
.balance-block{background:linear-gradient(135deg,rgba(0,242,255,.12),rgba(0,255,163,.08));border:1px solid rgba(0,242,255,.25);border-radius:14px;padding:16px;margin-top:14px;text-align:center}
.balance-lbl{font-size:10px;text-transform:uppercase;letter-spacing:3px;color:var(--muted);margin-bottom:4px}
.balance-val{font-family:'Share Tech Mono',monospace;font-size:28px;font-weight:900;background:linear-gradient(90deg,var(--cyan),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-row{display:flex;gap:10px;margin-bottom:14px}
.stat-card{flex:1;background:rgba(0,242,255,.04);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.stat-val{font-size:20px;font-weight:800;color:var(--cyan);font-family:'Share Tech Mono',monospace}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:1px}
.ref-block{background:rgba(168,85,247,.06);border:1px solid rgba(168,85,247,.2);border-radius:14px;padding:16px;margin-bottom:14px}
.ref-title{font-size:13px;font-weight:700;color:var(--purple);margin-bottom:8px}
.ref-link-box{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text);background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;padding:10px;word-break:break-all;cursor:pointer;position:relative}
.ref-stats{display:flex;gap:10px;margin-bottom:14px}
.ref-stat{flex:1;background:rgba(168,85,247,.06);border:1px solid rgba(168,85,247,.2);border-radius:12px;padding:14px;text-align:center}
.ref-stat-val{font-size:22px;font-weight:800;color:var(--purple);font-family:'Share Tech Mono',monospace}
.ref-stat-lbl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase}
.info-card{background:rgba(0,242,255,.04);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.info-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;font-size:13px}
.info-row:last-child{margin-bottom:0}
.info-ico{font-size:18px;min-width:24px}
.info-text{color:var(--text);line-height:1.5}
.info-text b{color:var(--cyan)}
.order-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:rgba(0,242,255,.03);border:1px solid rgba(0,242,255,.07);border-radius:12px;margin-bottom:8px}
.order-left{flex:1}
.order-name{font-size:14px;font-weight:700;color:var(--text)}
.order-date{font-size:11px;color:var(--muted);margin-top:2px}
.order-right{text-align:right}
.order-price{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--cyan)}
.status-badge{display:inline-block;font-size:10px;font-weight:700;border-radius:6px;padding:2px 8px;margin-top:4px}
.status-pending{background:rgba(251,191,36,.15);color:#fbbf24}
.status-completed{background:rgba(0,255,163,.15);color:var(--green)}
.status-cancelled{background:rgba(239,68,68,.15);color:#ef4444}
.status-processing{background:rgba(0,242,255,.15);color:var(--cyan)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,242,255,.15);backdrop-filter:blur(8px);border:1px solid rgba(0,242,255,.3);border-radius:12px;padding:10px 20px;font-size:13px;font-weight:600;color:var(--cyan);opacity:0;transition:all .3s;pointer-events:none;z-index:300;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loader{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.spinner{width:32px;height:32px;border:2px solid rgba(0,242,255,.2);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-ico{font-size:48px;margin-bottom:12px;opacity:.5}
</style>
</head>
<body>

<div id="page-shop" class="page active">
  <div class="page-header">
    <div class="page-title">⭐ Stars Market</div>
    <div class="lang-toggle" onclick="toggleLang()" id="langBtn">🇺🇿 UZ</div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('stars',this)">⭐ Stars</div>
    <div class="tab" onclick="switchTab('premium',this)">💎 Premium</div>
  </div>
  <div id="products-list">
    <div class="loader"><div class="spinner"></div><div id="load-text">Yuklanmoqda...</div></div>
  </div>
</div>

<div id="page-orders" class="page">
  <div class="page-header"><div class="page-title" id="orders-title">📦 Buyurtmalar</div></div>
  <div id="orders-list"><div class="loader"><div class="spinner"></div></div></div>
</div>

<div id="page-refs" class="page">
  <div class="page-header"><div class="page-title" id="refs-title">👥 Referallar</div></div>
  <div id="refs-content"><div class="loader"><div class="spinner"></div></div></div>
</div>

<div id="page-profile" class="page">
  <div class="page-header"><div class="page-title" id="profile-title">👤 Profil</div></div>
  <div id="profile-content"><div class="loader"><div class="spinner"></div></div></div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title"  id="modal-title"></div>
    <div class="modal-price"  id="modal-price"></div>
    <div class="modal-balance" id="modal-balance"></div>
    <button class="btn btn-primary" id="buy-btn" onclick="confirmBuy()">
      <span id="buy-btn-text">Sotib olish</span>
    </button>
    <button class="btn btn-secondary" onclick="document.getElementById('modal').classList.remove('open')">
      <span id="cancel-text">Bekor qilish</span>
    </button>
  </div>
</div>

<nav class="nav">
  <button class="nav-btn active" onclick="showPage('shop',this)">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span id="nav-shop">Do'kon</span>
  </button>
  <button class="nav-btn" onclick="showPage('orders',this)">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    <span id="nav-orders">Buyurtmalar</span>
  </button>
  <button class="nav-btn" onclick="showPage('refs',this)">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <span id="nav-refs">Referallar</span>
  </button>
  <button class="nav-btn" onclick="showPage('profile',this)">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span id="nav-profile">Profil</span>
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const params = new URLSearchParams(location.search);
const TG_ID  = params.get("tg_id") || "";
let LANG     = params.get("lang") || "ru";
let userData = null;
let products = [];
let currentTab = "stars";
let selectedProduct = null;

const i18n = {
  ru: {
    shop:"Магазин", orders:"Заказы", refs:"Рефералы", profile:"Профиль",
    loading:"Загрузка...", buy:"Купить", cancel:"Отмена",
    your_balance:"Ваш баланс", not_enough:"Недостаточно средств",
    no_orders:"Заказов пока нет", no_refs:"Рефералов пока нет",
    ref_link:"Реф. ссылка", copied:"Скопировано! ✓",
    ref_invited:"Приглашено", ref_paid:"Купили", ref_earned:"Заработано",
    ref_cond:"За каждого друга, который купит от", ref_cond2:"— вы получаете",
    cashback_info:"Кэшбек 2% с каждой покупки начисляется автоматически",
    order_sent:"✅ Заказ создан! Ожидайте выполнения.",
    err:"Ошибка. Попробуйте позже.",
    pending:"Ожидает", completed:"Выполнен", cancelled:"Отменён", processing:"Обработка",
    topup:"Пополнить баланс", spent:"Потрачено", orders_c:"Заказов",
  },
  uz: {
    shop:"Do'kon", orders:"Buyurtmalar", refs:"Referallar", profile:"Profil",
    loading:"Yuklanmoqda...", buy:"Sotib olish", cancel:"Bekor qilish",
    your_balance:"Sizning balansingiz", not_enough:"Balans yetarli emas",
    no_orders:"Hozircha buyurtmalar yo'q", no_refs:"Hozircha referallar yo'q",
    ref_link:"Ref. havola", copied:"Nusxa olindi! ✓",
    ref_invited:"Taklif qilingan", ref_paid:"Xarid qildi", ref_earned:"Daromad",
    ref_cond:"30 000 UZS dan xarid qilgan har bir do'st uchun", ref_cond2:"olasiz",
    cashback_info:"Har bir xariddan 2% keshbek avtomatik o'tkaziladi",
    order_sent:"✅ Buyurtma yaratildi! Bajarilishini kuting.",
    err:"Xatolik. Keyinroq urinib ko'ring.",
    pending:"Kutilmoqda", completed:"Bajarildi", cancelled:"Bekor qilindi", processing:"Jarayonda",
    topup:"Balansni to'ldirish", spent:"Sarflangan", orders_c:"Buyurtmalar",
  }
};

const T = k => (i18n[LANG] || i18n.ru)[k] || k;

function applyLang() {
  document.getElementById("langBtn").textContent    = LANG === "ru" ? "🇺🇿 UZ" : "🇷🇺 RU";
  document.getElementById("load-text").textContent  = T("loading");
  document.getElementById("orders-title").textContent  = "📦 " + T("orders");
  document.getElementById("refs-title").textContent    = "👥 " + T("refs");
  document.getElementById("profile-title").textContent = "👤 " + T("profile");
  document.getElementById("nav-shop").textContent    = T("shop");
  document.getElementById("nav-orders").textContent  = T("orders");
  document.getElementById("nav-refs").textContent    = T("refs");
  document.getElementById("nav-profile").textContent = T("profile");
  document.getElementById("buy-btn-text").textContent = T("buy");
  document.getElementById("cancel-text").textContent  = T("cancel");
}

function toggleLang() {
  LANG = LANG === "ru" ? "uz" : "ru";
  applyLang();
  renderProducts();
}

function showPage(name, btn) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("page-" + name).classList.add("active");
  btn.classList.add("active");
  if (name === "orders")  loadOrders();
  if (name === "refs")    loadRefs();
  if (name === "profile") loadProfile();
}

function switchTab(type, el) {
  currentTab = type;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  renderProducts();
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  return r.json();
}

async function loadProducts() {
  try {
    products = await api("/api/products");
    renderProducts();
  } catch(e) {
    document.getElementById("products-list").innerHTML =
      `<div class="empty"><div class="empty-ico">⚠️</div>${T("err")}</div>`;
  }
}

function fmt(n) {
  return Number(n).toLocaleString("ru-RU");
}

function renderProducts() {
  const list = products.filter(p => p.type === currentTab);
  const el   = document.getElementById("products-list");
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="empty-ico">${currentTab==="stars"?"⭐":"💎"}</div>${T("loading")}</div>`;
    return;
  }
  el.innerHTML = list.map(p => `
    <div class="product-item" onclick="openModal(${p.id})">
      <div class="product-left">
        <div class="product-ico">${p.type === "stars" ? "⭐" : "💎"}</div>
        <div>
          <div class="product-name">${p.name}</div>
          <div class="product-sub">${p.type === "stars" ? "Telegram Stars" : "Telegram Premium"}</div>
        </div>
      </div>
      <div class="product-price">${fmt(p.price)} UZS</div>
    </div>
  `).join("");
}

function openModal(productId) {
  selectedProduct = products.find(p => p.id === productId);
  if (!selectedProduct) return;
  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");

  document.getElementById("modal-title").textContent = selectedProduct.name;
  document.getElementById("modal-price").textContent = fmt(selectedProduct.price) + " UZS";
  document.getElementById("buy-btn-text").textContent = T("buy");
  document.getElementById("cancel-text").textContent  = T("cancel");

  const bal    = Number(userData?.balance ?? 0);
  const enough = bal >= selectedProduct.price;

  document.getElementById("modal-balance").innerHTML =
    `${T("your_balance")}: <b style="color:${enough?"var(--cyan)":"#ef4444"}">${fmt(bal)} UZS</b>` +
    (!enough ? `<br><small style="color:#ef4444">${T("not_enough")} (+${fmt(selectedProduct.price - bal)} UZS)</small>` : "");

  const buyBtn = document.getElementById("buy-btn");
  buyBtn.disabled       = !enough;
  buyBtn.style.opacity  = enough ? "1" : "0.4";

  document.getElementById("modal").classList.add("open");
}

function closeModal(e) {
  if (e.target.id === "modal")
    document.getElementById("modal").classList.remove("open");
}

async function confirmBuy() {
  if (!selectedProduct) return;
  const btn = document.getElementById("buy-btn");
  btn.disabled = true;
  btn.innerHTML = `<div class="spinner" style="width:20px;height:20px;margin:0 auto;border-width:2px"></div>`;

  try {
    const res = await api("/api/buy", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tg_id: TG_ID, product_id: selectedProduct.id, recipient: "self" }),
    });

    document.getElementById("modal").classList.remove("open");

    if (res.success) {
      showToast(T("order_sent"));
      if (userData) userData.balance = res.new_balance;
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    } else {
      showToast("❌ " + (res.error || T("err")));
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    }
  } catch(e) {
    showToast("❌ " + T("err"));
  }

  btn.disabled = false;
  btn.innerHTML = `<span id="buy-btn-text">${T("buy")}</span>`;
}

async function loadOrders() {
  const el = document.getElementById("orders-list");
  el.innerHTML = `<div class="loader"><div class="spinner"></div></div>`;
  try {
    const orders = await api(`/api/orders/${TG_ID}`);
    if (!orders.length) {
      el.innerHTML = `<div class="empty"><div class="empty-ico">📦</div>${T("no_orders")}</div>`;
      return;
    }
    const sc = {
      pending:"status-pending",
      completed:"status-completed",
      cancelled:"status-cancelled",
      processing:"status-processing"
    };
    el.innerHTML = orders.map(o => `
      <div class="order-item">
        <div class="order-left">
          <div class="order-name">${o.product}</div>
          <div class="order-date">${o.created_at} · #${o.id}</div>
        </div>
        <div class="order-right">
          <div class="order-price">${fmt(o.price)} UZS</div>
          <span class="status-badge ${sc[o.status]||''}">${T(o.status)||o.status}</span>
        </div>
      </div>
    `).join("");
  } catch(e) {
    el.innerHTML = `<div class="empty"><div class="empty-ico">⚠️</div>${T("err")}</div>`;
  }
}

async function loadRefs() {
  const el = document.getElementById("refs-content");
  el.innerHTML = `<div class="loader"><div class="spinner"></div></div>`;
  try {
    const u = await api(`/api/user/${TG_ID}`);
    const refLink = u.ref_link || "";
    el.innerHTML = `
      <div class="ref-stats">
        <div class="ref-stat">
          <div class="ref-stat-val">${u.referrals||0}</div>
          <div class="ref-stat-lbl">${T("ref_invited")}</div>
        </div>
        <div class="ref-stat">
          <div class="ref-stat-val">${u.paid_referrals||0}</div>
          <div class="ref-stat-lbl">${T("ref_paid")}</div>
        </div>
        <div class="ref-stat">
          <div class="ref-stat-val">${fmt((u.paid_referrals||0)*(u.ref_reward||3000))}</div>
          <div class="ref-stat-lbl">UZS</div>
        </div>
      </div>
      <div class="ref-block">
        <div class="ref-title">🔗 ${T("ref_link")}</div>
        <div class="ref-link-box" onclick="copyRef('${refLink}')">${refLink}</div>
      </div>
      <div class="info-card">
        <div class="info-row">
          <div class="info-ico">🎁</div>
          <div class="info-text">
            ${T("ref_cond")} <b>30 000 UZS</b> ${T("ref_cond2")} <b>+3 000 UZS</b>
          </div>
        </div>
        <div class="info-row">
          <div class="info-ico">💸</div>
          <div class="info-text">${T("cashback_info")}</div>
        </div>
      </div>
    `;
  } catch(e) {
    el.innerHTML = `<div class="empty"><div class="empty-ico">⚠️</div>${T("err")}</div>`;
  }
}

function copyRef(link) {
  navigator.clipboard?.writeText(link).catch(() => {});
  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
  showToast(T("copied"));
}

async function loadProfile() {
  const el = document.getElementById("profile-content");
  el.innerHTML = `<div class="loader"><div class="spinner"></div></div>`;
  try {
    const u = await api(`/api/user/${TG_ID}`);
    userData = u;
    const bal = Number(u.balance || 0);
    el.innerHTML = `
      <div class="profile-hero">
        <div class="profile-avatar">👤</div>
        <div class="profile-name">@${u.username || "User"}</div>
        <div class="profile-id">ID: ${u.tg_id}</div>
        <div class="balance-block">
          <div class="balance-lbl">${T("your_balance")}</div>
          <div class="balance-val">${fmt(bal)} UZS</div>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-card">
          <div class="stat-val">${u.orders_count||0}</div>
          <div class="stat-lbl">${T("orders_c")}</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">${fmt(u.total_spent||0)}</div>
          <div class="stat-lbl">${T("spent")} UZS</div>
        </div>
      </div>
      <button class="btn btn-secondary" onclick="if(tg)tg.close()">
        💳 ${T("topup")}
      </button>
    `;
  } catch(e) {
    el.innerHTML = `<div class="empty"><div class="empty-ico">⚠️</div>${T("err")}</div>`;
  }
}

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2500);
}

applyLang();
loadProducts();
api(`/api/user/${TG_ID}`).then(u => { userData = u; }).catch(() => {});
</script>
</body>
</html>
