<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Softs Do'koni</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
            margin: 0;
            padding: 15px;
        }
        h1 {
            font-size: 20px;
            text-align: center;
            color: var(--tg-theme-button-color, #2481cc);
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .product-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .product-card {
            border: 1px solid var(--tg-theme-hint-color, #cccccc);
            border-radius: 10px;
            padding: 15px;
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-title {
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }
        .product-desc {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #777777);
            margin: 0 0 10px 0;
        }
        .product-price {
            font-size: 15px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #2481cc);
            margin-bottom: 10px;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Telegram Softs Do'koni</h1>
    
    <div class="product-list">
        <div class="product-card">
            <div>
                <p class="product-title">Telegram Spammer Soft v3</p>
                <p class="product-desc">Guruhlar va shaxsiy xabarlarga avtomatik xabar yuborish dasturi.</p>
            </div>
            <div>
                <p class="product-price">150,000 UZS</p>
                <button class="btn" onclick="buyProduct('Telegram Spammer', 150000)">Sotib olish</button>
            </div>
        </div>

        <div class="product-card">
            <div>
                <p class="product-title">Telegram Parser Pro</p>
                <p class="product-desc">Guruhlardan maqsadli auditoriya va kontaktlarni yig'uvchi dastur.</p>
            </div>
            <div>
                <p class="product-price">200,000 UZS</p>
                <button class="btn" onclick="buyProduct('Telegram Parser', 200000)">Sotib olish</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Telegram Web App ob'ektini ishga tushirish
    const tg = window.Telegram.WebApp;
    tg.expand(); // Oynani to'liq ekranga ochish

    // Bot mavzusiga mos ranglarni sozlash
    document.body.style.setProperty('--tg-theme-bg-color', tg.backgroundColor);
    document.body.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color);
    document.body.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color);
    document.body.style.setProperty('--tg-theme-button-text-color', tg.themeParams.button_text_color);

    // Sotib olish tugmasi bosilganda botga ma'lumot jo'natish
    function buyProduct(name, price) {
        const data = {
            product_name: name,
            product_price: price,
            action: 'checkout'
        };
        
        // Botga ma'lumotni JSON ko'rinishida yuborish
        tg.sendData(JSON.stringify(data));
        
        // Oynani yopish
        tg.close();
    }
</script>
</body>
</html>
