<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <title>Telegram Softs Bot</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0b0b12;
            font-family: system-ui, -apple-system, 'Inter',
                         'Segoe UI', Roboto, sans-serif;
            padding: 20px 16px 90px;
            color: #fff;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #12121e;
            border-radius: 16px;
            padding: 10px 14px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .tbl-ico {
            background: linear-gradient(135deg,
                        #f59e0b,
                        #8b5cf6);
            width: 34px;
            height: 34px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
        }

        .tbl-name {
            font-size: 16px;
            font-weight: 800;
            background: linear-gradient(135deg,
                        #00d4ff,
                        #8b5cf6);

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tb-u {
            background: rgba(255,255,255,0.08);
            padding: 4px 12px;
            border-radius: 18px;
            font-size: 12px;
        }

        .tb-v {
            background: linear-gradient(135deg,
                        #00d4ff,
                        #0099cc);

            padding: 4px 12px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin: 20px 0 12px;
        }

        .card {
            background: rgba(22,22,32,0.8);
            border-radius: 24px;
            padding: 14px 18px;
            margin-bottom: 12px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border: 1px solid rgba(255,255,255,0.06);
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-circle {
            width: 48px;
            height: 48px;

            background: #1e1e2c;

            border-radius: 28px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .price {
            font-size: 16px;
            font-weight: 700;
            margin-top: 4px;
        }

        .price-star {
            color: #f5b042;
        }

        .price-premium {
            color: #e2aaff;
        }

        .badge {
            font-size: 10px;
            background: rgba(245,176,66,0.15);

            padding: 2px 8px;

            border-radius: 20px;

            display: inline-block;
            margin-top: 4px;
        }

        .buy-btn {
            background: #2a2a36;

            border: none;
            border-radius: 40px;

            padding: 8px 24px;

            font-weight: 700;
            font-size: 13px;

            color: #eee;

            cursor: pointer;
        }

        .bottom-nav {
            position: fixed;

            bottom: 12px;
            left: 16px;
            right: 16px;

            background: rgba(20,20,28,0.96);

            border-radius: 44px;

            display: flex;
            justify-content: space-between;

            padding: 8px 16px;

            border: 1px solid rgba(255,255,255,0.08);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 2px;

            font-size: 10px;
            font-weight: 600;

            color: #8a8aa0;

            cursor: pointer;

            padding: 6px 10px;

            border-radius: 40px;
        }

        .nav-item.active {
            background: #2e2e3c;
            color: #f5b042;
        }

        .toast {
            position: fixed;

            bottom: 90px;
            left: 50%;

            transform: translateX(-50%);

            background: #2a2a36;

            padding: 8px 18px;

            border-radius: 40px;

            font-size: 13px;

            z-index: 1000;

            opacity: 0;

            transition: 0.2s;

            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        #payPage {
            position: fixed;

            inset: 0;

            background: #0b0b12;

            z-index: 200;

            overflow-y: auto;

            display: none;
        }

        #payPage.open {
            display: block;
        }
<body>

<div id="mainApp">
    <div class="topbar">
        <div style="display: flex; align-items: center; gap: 8px;">
            <div class="tbl-ico">⚡</div>
            <div class="tbl-name">SOFTS</div>
        </div>

        <div style="display: flex; gap: 8px;">
            <div class="tb-u" id="tbU">@username</div>
            <div class="tb-v" id="verifyBtn">✦ Verify</div>
        </div>
    </div>

    <!-- Главная -->
    <div id="homePage">
        <div class="section-title">⭐ Звёзды</div>
        <div id="starsList"></div>

        <div class="section-title">💎 Премиум</div>
        <div id="premiumList"></div>
    </div>

    <!-- Рефералы -->
    <div id="refPage" style="display: none;">
        <div style="background: #12121e; border-radius: 24px; padding: 20px; margin: 20px 0; text-align: center;">

            <div style="font-size: 48px; margin-bottom: 10px;">👥</div>

            <div style="font-size: 24px; font-weight: 700;">
                Do'stlarni taklif qiling
            </div>

            <div style="margin: 15px 0; opacity: 0.7;">
                Havolangizdan yangi do'stingiz tashrif buyursa
                <strong style="color:#f5b042;">+3 000 UZS</strong>
                bonus olasiz va ularning har bir xarididan
                <strong style="color:#f5b042;">3%</strong>
                cashback olasiz.
            </div>

            <div style="background: #1e1e2c; border-radius: 16px; padding: 12px; margin: 15px 0;">
                https://t.me/softsbot?start=123456
            </div>

            <button class="copy-btn"
                    onclick="toast('✅ Ссылка скопирована')">
                Скопировать ссылку
            </button>

            <div style="display: flex; gap: 12px; margin-top: 20px;">

                <div style="flex:1; background: #1e1e2c; border-radius: 16px; padding: 12px;">
                    <div>👥</div>
                    <div style="font-size: 24px; font-weight: 800;" id="refCount">0</div>
                    <div>Приглашено</div>
                </div>

                <div style="flex:1; background: #1e1e2c; border-radius: 16px; padding: 12px;">
                    <div>🏆</div>
                    <div style="font-size: 24px; font-weight: 800;" id="refEarn">0</div>
                    <div>Заработано</div>
                </div>

            </div>
        </div>
    </div>

    <!-- События -->
    <div id="eventsPage" style="display: none;">

        <div style="background: #12121e; border-radius: 24px; padding: 20px; margin: 20px 0;">

            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">

                <div style="background: rgba(245,158,11,0.15);
                            width: 48px;
                            height: 48px;
                            border-radius: 50%;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            font-size: 24px;">
                    🎁
                </div>

                <div>
                    <div style="font-weight: 700;">
                        Umumiy savdo maqsadi
                    </div>

                    <div style="font-size: 12px; opacity: 0.7;">
                        NFT olish uchun 1 200 000 so'm
                    </div>
                </div>

            </div>

            <div style="background: rgba(255,255,255,0.08);
                        border-radius: 10px;
                        height: 8px;
                        margin: 10px 0;">

                <div style="width: 4%;
                            height: 100%;
                            background: linear-gradient(90deg,#8b5cf6,#00d4ff);
                            border-radius: 10px;">
                </div>

            </div>

            <div style="display: flex; justify-content: space-between; font-size: 12px;">
                <span>55 000 so'm</span>
                <span>1 200 000 so'm</span>
            </div>

        </div>

        <div class="section-title">Топ продавцов</div>

        <div id="topSellersList"></div>
    </div>

    <!-- Маркет -->
    <div id="marketPage" style="display: none;">

        <div class="section-title">⭐ Звёзды</div>
        <div id="marketStarsList"></div>

        <div class="section-title">💎 Премиум</div>
        <div id="marketPremiumList"></div>

    </div>

    <!-- Профиль -->
    <div id="profilePage" style="display: none;">

        <div style="background: linear-gradient(135deg,#1a237e,#283593,#1565c0);
                    border-radius: 28px;
                    padding: 24px;
                    text-align: center;
                    margin: 20px 0;">

            <div style="width: 70px;
                        height: 70px;
                        background: linear-gradient(135deg,#00d4ff,#8b5cf6);
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 30px;
                        margin: 0 auto 12px;">
                👤
            </div>

            <div style="font-size: 20px; font-weight: 800;"
                 id="profileName">
                —
            </div>

            <div style="opacity: 0.7;"
                 id="profileUsername">
                @username
            </div>

            <div style="font-size: 12px; margin-top: 4px;"
                 id="profileId">
                ID: —
            </div>

            <div style="margin: 20px 0 10px;">

                <div style="font-size: 12px; opacity: 0.6;">
                    БАЛАНС
                </div>

                <div style="font-size: 32px;
                            font-weight: 800;"
                     id="profileBalance">
                    0 UZS
                </div>

            </div>

            <button class="copy-btn"
                    style="background: rgba(255,255,255,0.15);
                           color: white;"
                    onclick="toast('💰 Пополнение в разработке')">

                Пополнить

            </button>

        </div>

        <div class="section-title">История заказов</div>

        <div id="ordersList"></div>

    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">

        <div class="nav-item" data-page="ref">
            👥 Рефералы
        </div>

        <div class="nav-item" data-page="events">
            📅 События
        </div>

        <div class="nav-item active" data-page="home">
            🏠 Главная
        </div>

        <div class="nav-item" data-page="market">
            🛒 Маркет
        </div>

        <div class="nav-item" data-page="profile">
            👤 Профиль
        </div>

    </div>

</div>
