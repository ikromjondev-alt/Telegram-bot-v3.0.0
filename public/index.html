<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Softs Do'koni</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #222222;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-secondary-bg-color: #f5f5f5;
            --tg-theme-hint-color: #cccccc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            padding: 15px;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            font-size: 20px;
            text-align: center;
            color: var(--tg-theme-button-color);
            margin-bottom: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .product-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .product-card {
            border: 1px solid var(--tg-theme-hint-color);
            border-radius: 12px;
            padding: 15px;
            background-color: var(--tg-theme-secondary-bg-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .product-title {
            font-size: 17px;
            font-weight: bold;
            margin: 0 0 6px 0;
        }
        .product-desc {
            font-size: 13px;
            color: var(--tg-theme-text-color);
            opacity: 0.7;
            margin: 0 0 12px 0;
            line-height: 1.4;
        }
        .product-price {
            font-size: 16px;
            font-weight: bold;
            color: var(--tg-theme-button-color);
            margin-bottom: 12px;
        }
        .btn {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: opacity 0.2s ease;
        }
        .btn:active {
            opacity: 0.75;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Telegram Softs Do'koni</h1>
    
    <div class="product-list">
        <div class="product-card">
            <div>
                <p class="product-title">Telegram Spammer Soft v3</p>
                <p class="product-desc">Guruhlar va shaxsiy xabarlarga avtomatik xabar yuborish dasturi.</p>
            </div>
            <div>
                <p class="product-price">150,000 UZS</p>
                <button class="btn" onclick="buyProduct('Telegram Spammer', 150000)">Sotib olish</button>
            </div>
        </div>

        <div class="product-card">
            <div>
                <p class="product-title">Telegram Parser Pro</p>
                <p class="product-desc">Guruhlardan maqsadli auditoriya va kontaktlarni yig'uvchi dastur.</p>
            </div>
            <div>
                <p class="product-price">200,000 UZS</p>
                <button class="btn" onclick="buyProduct('Telegram Parser', 200000)">Sotib olish</button>
            </div>
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    
    // Telegram yuklanishi bilan oynani to'liq kattalashtiramiz
    tg.ready();
    tg.expand(); 

    // Ranglarni Telegram mavzusiga (Dark/Light) avtomat moslashtirish funksiyasi
    function applyTheme() {
        if (tg.themeParams.bg_color) {
            document.documentElement.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color);
        }
        if (tg.themeParams.text_color) {
            document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color);
        }
        if (tg.themeParams.button_color) {
            document.documentElement.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color);
        }
        if (tg.themeParams.button_text_color) {
            document.documentElement.style.setProperty('--tg-theme-button-text-color', tg.themeParams.button_text_color);
        }
        if (tg.themeParams.secondary_bg_color) {
            document.documentElement.style.setProperty('--tg-theme-secondary-bg-color', tg.themeParams.secondary_bg_color);
        }
        if (tg.themeParams.hint_color) {
            document.documentElement.style.setProperty('--tg-theme-hint-color', tg.themeParams.hint_color);
        }
    }

    // Mavzuni darhol qo'llash va foydalanuvchi Telegram mavzusini o'zgartirsa ham real-vaqtda yangilash
    applyTheme();
    tg.onEvent('themeChanged', applyTheme);

    // Sotib olish tugmasi bosilganda ma'lumotni backend (src/index.ts) ga yuborish
    function buyProduct(name, price) {
        const data = {
            product_name: name,
            price: price
        };
        
        // Botga JSON string holatida xavfsiz yuboramiz
        tg.sendData(JSON.stringify(data));
        tg.close();
    }
</script>
</body>
</html>
